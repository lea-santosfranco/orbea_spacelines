# Intégration continue : à chaque push et pull request, l'API et le site sont vérifiés automatiquement
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Base PostgreSQL éphémère, créée pour la durée des tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orbea
          POSTGRES_PASSWORD: orbea_ci
          POSTGRES_DB: orbea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://orbea:orbea_ci@localhost:5432/orbea?schema=public

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm audit --audit-level=high
      - run: npm test

  site:
    name: Site (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
